[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acon"
version = "0.1.0"
authors = [
  { name="WillyEverGreen" },
]
description = "🗼 Template-Aware Site Intelligence & Discovery Engine"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Intended Audience :: Developers",
]
dependencies = [
    "curl-cffi>=0.6.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.19.0",
]

[project.urls]
"Homepage" = "https://github.com/WillyEverGreen/acon"
"Bug Tracker" = "https://github.com/WillyEverGreen/acon/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["acon*"]
